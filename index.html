<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#4d9be8"
  >

  <title>
    2026年高屏澎青職特會行前通知
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="content.js"
    defer
  ></script>

  <script
    src="app.js"
    defer
  ></script>
</head>


<body>

  <main class="page">


    <!-- =========================
         標題主視覺
    ========================== -->

    <section class="hero">

      <div class="hero-content">

        <div class="hero-title-row">

          <h1 id="page-title">
            2026年高屏澎青職特會
          </h1>

          <span class="notice-tag">
            行前通知
          </span>

        </div>

      </div>


      <!-- 純美術幾何圖形 -->

      <div
        class="hero-art"
        aria-hidden="true"
      >

        <div class="shape shape-blue-left"></div>

        <div class="shape shape-light-left"></div>

        <div class="shape shape-blue-right"></div>

        <div class="shape shape-beige-square"></div>

        <div class="shape shape-brown-square"></div>

        <div class="shape shape-ring"></div>

        <div class="shape shape-brown-line"></div>

        <div class="shape shape-dot-one"></div>

        <div class="shape shape-dot-two"></div>

      </div>

    </section>



    <!-- =========================
         配色裝飾
    ========================== -->

    <div
      class="color-strip"
      aria-hidden="true"
    >
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>


    <div class="hint">
      點選項目即可展開或收合內容
    </div>



    <!-- =========================
         內容由 app.js 產生
    ========================== -->

    <section
      id="accordion"
      class="accordion"
    ></section>


    <footer>
      2026年高屏澎青職特會
    </footer>


  </main>

</body>

</html>
